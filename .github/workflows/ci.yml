name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook,plot]"
      - run: python -m ruff check src tests tools
      - run: python tools/check_documentation.py
      - run: python -m pytest
      - run: >-
          python -m jupyter nbconvert --to notebook --execute
          examples/getting_started.ipynb --output-dir .cache
          --output getting_started.executed.ipynb --ExecutePreprocessor.timeout=300
      - run: python -m build

  supported-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  optional-extras:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: [fast, notebook, plot, plot_static]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[${{ matrix.extra }}]"
      - run: python -c "import gregorithm; print(gregorithm.__version__)"
