name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - name: Type-check Windows, Linux and macOS branches
        run: |
          mypy --platform win32
          mypy --platform linux
          mypy --platform darwin

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import gregorithm; print(gregorithm.__version__)"
      - name: Run the test suite against the installed wheel
        run: python -m pytest -q

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[notebooks]"
      - name: Run every example notebook
        run: |
          python - <<'EOF'
          import pathlib
          import nbformat
          from nbclient import NotebookClient
          for path in sorted(pathlib.Path("examples/notebooks").glob("*.ipynb")):
              notebook = nbformat.read(path, as_version=4)
              NotebookClient(notebook, timeout=300, resources={"metadata": {"path": str(path.parent)}}).execute()
              print("OK", path.name)
          EOF
