[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gregorithm"
version = "0.1.0"
description = "Streaming analysis of standardized battery electrochemistry data"
authors = [{name = "Alessandro Gregucci"}]
maintainers = [{name = "Alessandro Gregucci"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["battery", "electrochemistry", "cycling", "dcir", "dqdv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "pyarrow>=15", "scipy>=1.12"]

[project.urls]
Repository = "https://github.com/GregAlex7zZ/gregorithm"
Issues = "https://github.com/GregAlex7zZ/gregorithm/issues"

[project.optional-dependencies]
fast = ["numba>=0.59"]
notebook = ["pandas>=2.2", "jupyterlab>=4"]
plot = ["plotly>=5", "anywidget>=0.9", "ipywidgets>=8"]
plot_static = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "ruff>=0.11",
  "build>=1.2",
  "psutil>=5",
  "pandas>=2.2",
  "numba>=0.59",
  "plotly>=5",
  "anywidget>=0.9",
  "ipywidgets>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gregorithm"]
[tool.hatch.build.targets.sdist]
include = [
  "/src/gregorithm/**/*.py", "/tests/*.py", "/examples/getting_started.ipynb",
  "/docs/**/*.md", "/tools/check_documentation.py", "/tools/run_tests.py",
  "/tools/validate_release.py", "/README.md", "/CONTRIBUTING.md",
  "/AUTHORS.md", "/CHANGELOG.md", "/TODO.md", "/LICENSE",
  "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml", "/.gitignore", "/.gitattributes", "/.editorconfig",
  "/.github/workflows/*.yml", "/.github/ISSUE_TEMPLATE/*.yml",
  "/.github/dependabot.yml",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405"]
"benchmarks/run.py" = ["F403", "F405"]
